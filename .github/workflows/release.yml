name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify and build installable APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "JavaTavern-${GITHUB_REF_NAME}.apk"
          sha256sum "JavaTavern-${GITHUB_REF_NAME}.apk" > "JavaTavern-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          files: |
            JavaTavern-${{ github.ref_name }}.apk
            JavaTavern-${{ github.ref_name }}.apk.sha256
