name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # 如果仓库配置了签名密钥就用正式签名；没有配置则 build.gradle.kts
      # 会自动回退到 debug 签名，仍然产出可安装的 APK（见 docs/RELEASE_PROCESS.md）。
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JAVATAVERN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "JAVATAVERN_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the configured release signing key."
          else
            echo "No keystore secret configured; the release APK will use the debug signing key."
          fi

      - name: Verify and build release APK
        env:
          JAVATAVERN_KEYSTORE_PASSWORD: ${{ secrets.JAVATAVERN_KEYSTORE_PASSWORD }}
          JAVATAVERN_KEY_ALIAS: ${{ secrets.JAVATAVERN_KEY_ALIAS }}
          JAVATAVERN_KEY_PASSWORD: ${{ secrets.JAVATAVERN_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk "JavaTavern-${GITHUB_REF_NAME}.apk"
          sha256sum "JavaTavern-${GITHUB_REF_NAME}.apk" > "JavaTavern-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'preview') }}
          files: |
            JavaTavern-${{ github.ref_name }}.apk
            JavaTavern-${{ github.ref_name }}.apk.sha256
